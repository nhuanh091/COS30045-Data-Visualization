<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>SVG House & Garden — D3 shapes demo</title>
	<script src="https://d3js.org/d3.v7.min.js"></script>
	<style>
		body{font-family:Arial,Helvetica,sans-serif;background:#eef;margin:12px}
		h1{font-size:18px;margin:6px 0}
		#viz{display:flex;justify-content:center}
		svg{max-width:100%;height:auto;border-radius:6px}
		.label{font:14px/1.1 Arial,Helvetica,sans-serif;fill:#333}
	</style>
</head>
<body>
	<h1>SVG House & Garden — D3.js shapes demo</h1>
	<div id="content"></div>
	<div id="viz"></div>
	<svg id="exerciseSvg" width="320" height="140" style="display:block;margin:12px auto;border:1px solid #ddd;background:#fff"></svg>

	<script>
		const width = 900, height = 500;
		const svg = d3.select('#viz').append('svg').attr('width', width).attr('height', height).attr('viewBox', `0 0 ${width} ${height}`);

		const defs = svg.append('defs');
		const sky = defs.append('linearGradient').attr('id', 'sky').attr('x1', '0%').attr('x2', '0%').attr('y1', '0%').attr('y2', '100%');
		sky.append('stop').attr('offset', '0%').attr('stop-color', '#87CEEB');
		sky.append('stop').attr('offset', '100%').attr('stop-color', '#E6F7FF');
		const wood = defs.append('linearGradient').attr('id', 'wood').attr('x1', '0%').attr('x2', '100%');
		wood.append('stop').attr('offset', '0%').attr('stop-color', '#8B5A2B');
		wood.append('stop').attr('offset', '100%').attr('stop-color', '#C68642');
		const lawn = defs.append('linearGradient').attr('id', 'lawn').attr('x1', '0%').attr('x2', '0%').attr('y1', '0%').attr('y2', '1');
		lawn.append('stop').attr('offset', '0%').attr('stop-color', '#6BCB3A');
		lawn.append('stop').attr('offset', '100%').attr('stop-color', '#3AA035');
		const sunGrad = defs.append('radialGradient').attr('id','sunGrad');
		sunGrad.append('stop').attr('offset','0%').attr('stop-color','#fff27a');
		sunGrad.append('stop').attr('offset','60%').attr('stop-color','#ffd24d');

		svg.append('rect').attr('width', width).attr('height', height).attr('fill', 'url(#sky)');
		svg.append('rect').attr('x',0).attr('y',height*0.65).attr('width',width).attr('height',height*0.35).attr('fill','url(#lawn)');

		svg.append('circle').attr('cx', width-100).attr('cy', 80).attr('r', 50).attr('fill', 'url(#sunGrad)').attr('stroke', '#ffb84d').attr('stroke-width',2);

		const house = svg.append('g').attr('transform','translate(180,170)');
		house.append('rect').attr('x',0).attr('y',80).attr('width',300).attr('height',200).attr('fill','#f5f0e1').attr('stroke','#c9bba7').attr('stroke-width',2);
		house.append('polygon').attr('points','-20,80 150,-20 320,80').attr('fill','#b22222').attr('stroke','#8b0000').attr('stroke-width',2);
		house.append('rect').attr('x',130).attr('y',200).attr('width',40).attr('height',80).attr('fill','#6b4423').attr('stroke','url(#wood)').attr('stroke-width',2);
		house.append('circle').attr('cx',160).attr('cy',240).attr('r',3).attr('fill','#ffd700');

		const win = house.append('g').attr('class','windows');
		win.append('rect').attr('x',40).attr('y',120).attr('width',60).attr('height',50).attr('fill','#add8e6').attr('stroke','#6daedb').attr('stroke-width',2);
		win.append('line').attr('x1',70).attr('y1',120).attr('x2',70).attr('y2',170).attr('stroke','#6daedb').attr('stroke-width',2);
		win.append('line').attr('x1',40).attr('y1',145).attr('x2',100).attr('y2',145).attr('stroke','#6daedb').attr('stroke-width',2);
		win.append('rect').attr('x',200).attr('y',120).attr('width',60).attr('height',50).attr('fill','#add8e6').attr('stroke','#6daedb').attr('stroke-width',2);
		win.append('line').attr('x1',230).attr('y1',120).attr('x2',230).attr('y2',170).attr('stroke','#6daedb').attr('stroke-width',2);
		win.append('line').attr('x1',200).attr('y1',145).attr('x2',260).attr('y2',145).attr('stroke','#6daedb').attr('stroke-width',2);

		house.append('rect').attr('x',240).attr('y',10).attr('width',20).attr('height',60).attr('fill','#8b4b3a').attr('stroke','#5a2f24').attr('stroke-width',1);
		house.append('path').attr('d','M250,10 q10,-20 0,-40 q10,15 0,30 q5,10 -10,30').attr('fill','none').attr('stroke','#bbb').attr('stroke-width',3).attr('opacity',0.6);

		svg.append('polyline').attr('points','320,370 300,400 250,430 220,430 190,400 170,370').attr('fill','none').attr('stroke','#a87f57').attr('stroke-width',6).attr('stroke-linecap','round').attr('transform','translate(0,-20)').attr('opacity',0.9);

		const fence = svg.append('g').attr('transform','translate(0,260)');
		for(let i=0;i<12;i++){ fence.append('rect').attr('x',20+i*70).attr('y',60).attr('width',14).attr('height',40).attr('fill','#fff').attr('stroke','#dcdcdc'); fence.append('line').attr('x1',10+i*70).attr('y1',75).attr('x2',25+i*70).attr('y2',75).attr('stroke','#dcdcdc').attr('stroke-width',4); }

		const treeData = [{x:60,y:320,s:40},{x:120,y:300,s:55},{x:740,y:320,s:50}];
		const trees = svg.append('g');
		treeData.forEach(d=>{
			const g = trees.append('g').attr('transform',`translate(${d.x},${d.y})`);
			g.append('rect').attr('x',-6).attr('y',15).attr('width',12).attr('height',35).attr('fill','#8b5a2b');
			g.append('ellipse').attr('cx',0).attr('cy',0).attr('rx',d.s).attr('ry',d.s*0.7).attr('fill','#2e8b57').attr('stroke','#1e6b3f');
		});

		const bush = svg.append('g').attr('transform','translate(480,360)');
		bush.append('ellipse').attr('cx',0).attr('cy',0).attr('rx',60).attr('ry',30).attr('fill','#2d7c3e');
		bush.append('ellipse').attr('cx',40).attr('cy',10).attr('rx',45).attr('ry',22).attr('fill','#3fb14a');

		const flower = svg.append('g').attr('transform','translate(540,360) scale(1)');
		for(let i=0;i<6;i++){ flower.append('path').attr('d','M0,0 q15,-20 30,0 q-15,10 -30,0').attr('fill','#ff6b6b').attr('transform',`rotate(${i*60}) translate(0,-10)`).attr('opacity',0.9); }
		flower.append('circle').attr('r',8).attr('fill','#ffd700');

		svg.append('text').attr('x',20).attr('y',30).attr('class','label').text('House & Garden — SVG shapes with D3.js').attr('font-size',18);
		svg.append('text').attr('x',width-380).attr('y',height-10).attr('fill','#333').attr('font-size',12).text('Shapes used: rect, circle, ellipse, line, polyline, polygon, path, text, gradients');

		house.select('polygon').on('mouseover',function(){ d3.select(this).attr('fill','#ff6347'); }).on('mouseout',function(){ d3.select(this).attr('fill','#b22222'); });
	</script>
	<script src="../d3-demo.js"></script>
	</body>
	</html>
